name: Android

on:
  push:
    branches: [reescrita, novo, main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: SDK do Android (plataforma 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Estilo (ktlint)
        run: ./gradlew ktlintCheck --continue

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest :core:model:test :core:testing:test --continue

      - name: Lint do Android
        run: ./gradlew :app:lintDebug

      - name: APK de debug
        run: ./gradlew :app:assembleDebug

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: conversa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            **/build/reports/
            !app-legado/**
          retention-days: 7
